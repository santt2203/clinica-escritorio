# Infraestructura de la clínica. Ejecutar `mvn package` antes de levantar los WAR.
services:
  db:
    image: postgres:16
    container_name: clinica-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lapass
    ports:
      - "5433:5432"
    volumes:
      - clinica-datos:/var/lib/postgresql/data

  servicio:
    image: tomcat:10.1-jdk21-temurin
    container_name: clinica-servicio
    restart: unless-stopped
    depends_on:
      - db
    environment:
      CLINICA_DB_URL: jdbc:postgresql://db:5432/clinicadb
      CLINICA_DB_USER: postgres
      CLINICA_DB_PASSWORD: lapass
    ports:
      - "8081:8080"
    volumes:
      - ./clinica-servicio/target/clinica-servicio.war:/usr/local/tomcat/webapps/clinica-servicio.war:ro

  web:
    image: tomcat:10.1-jdk21-temurin
    container_name: clinica-web
    restart: unless-stopped
    depends_on:
      - servicio
    environment:
      CLINICA_SOAP_WSDL: http://servicio:8080/clinica-servicio/soap/ClinicaService?wsdl
    ports:
      - "8080:8080"
    volumes:
      - ./clinica-web/target/clinica-web.war:/usr/local/tomcat/webapps/clinica-web.war:ro

volumes:
  clinica-datos:
